
services:
  fastapi-app:
    build: ./fastApi
    ports:
      - "${APP_PORT}:5000"
    volumes:
      - ./fastApi:/app
    depends_on:
      - minio
    networks:
      - pipeline-net

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
     MINIO_ROOT_USER: "admin"
     MINIO_ROOT_PASSWORD: "password1234"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - pipeline-net

networks:
  pipeline-net:
    driver: bridge

volumes:
  minio_data:

